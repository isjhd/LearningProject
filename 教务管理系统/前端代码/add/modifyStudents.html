<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改学生信息</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background">
        <div class="box">
            <form action="#" method="post">
                <h2>修改学生信息</h2>
                <table class="teacherAddForm" align="center" border="1" cellpadding="0" cellspacing="0" width="300" height="200">
                    <tr>
                        <th>学号</th>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <th>姓名</th>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <th>性别</th>
                        <td>
                            <input type="radio" name="sex" checked="checked">♂
                            <input type="radio" name="sex">♀
                        </td>
                    </tr>
                    <tr>
                        <th>联系方式</th>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <th>家庭住址</th>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <th>所在班级</th>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <th>状态</th>
                        <td>
                            <input type="radio" name="zai" checked="checked">在籍
                            <input type="radio" name="buzai">开除
                        </td>
                    </tr>
                </table>
                <input type="submit">&emsp;<input type="submit" value="离开">
            </form>
        </div>
    </div>
</body>
</html>
