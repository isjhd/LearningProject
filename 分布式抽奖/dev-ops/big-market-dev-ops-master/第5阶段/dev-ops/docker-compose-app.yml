version: '3.8'
# 命令执行 docker-compose -f docker-compose-app.yml up -d
services:
  # 大营销后端
  big-market-app-01:
    image: fuzhengwei/big-market-app:5.1
    container_name: big-market-app-01
    restart: always
    ports:
      - "8092:8092"
    environment:
      - TZ=PRC
      - SERVER_PORT=8092
      - APP_CONFIG_API_VERSION=v1
      - APP_CONFIG_CROSS_ORIGIN=*
      - ZOOKEEPER_SDK_CONFIG_ENABLE=true
      - SPRING_RABBITMQ_ADDRESSES=111.228.40.67
    volumes:
      - ./log:/data/log
    networks:
      - my-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 大营销后端
  big-market-app-02:
    image: fuzhengwei/big-market-app:5.1
    container_name: big-market-app-02
    restart: always
    ports:
      - "8093:8093"
    environment:
      - TZ=PRC
      - SERVER_PORT=8093
      - APP_CONFIG_API_VERSION=v1
      - APP_CONFIG_CROSS_ORIGIN=*
      - ZOOKEEPER_SDK_CONFIG_ENABLE=true
      - SPRING_RABBITMQ_ADDRESSES=111.228.40.67
    volumes:
      - ./log:/data/log
    networks:
      - my-network
    logging:
      driver: "json-file"
