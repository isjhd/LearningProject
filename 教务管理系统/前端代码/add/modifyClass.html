<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改班级信息</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="background">
    <div class="box">
        <form action="#" method="post">
            <h2>修改班级信息</h2>
            <table class="teacherAddForm" align="center" border="1" cellpadding="0" cellspacing="0" width="300"
                   height="200">
                <tr>
                    <th>班级名称</th>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <th>班级简介</th>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <th>班主任</th>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <th>班级人数</th>
                    <td><input type="text"></td>
                </tr>
            </table>
            <input type="submit">&emsp;<input type="submit" value="离开">
        </form>
    </div>
</div>
</body>
</html>
