<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改班主任资料</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    
    <div class="container">

		<!-- 上 -->
		<div class="topContent">
			<div class="manger">教 务 管 理 系 统</div>
			<div class="other">
				<div class="left"><img src="images/1.gif"/></div>
                <div>阿良良木历</div>
                <a href="teacherUpdataDataManager.html">修改资料</a>
				<a href="#">
					<input type='button' value='退出' id="exitLogin">
				</a>
			</div>
		</div>
		<!-- 上 -->
	
		<!-- 中 -->
		<div class="centerContent">
			<div class="leftContent">
				<a href="teacherMain.html">学 生 管 理</a>
				<a href="teacherClassManager.html">班 级 管 理</a>
				<a href="teacherActivityManager.html">活 动 管 理</a>
				<a href="teacherResourceManager.html">资 料 下 载</a>
			</div>
			<div class="rightContent">
				<h2>修改资料</h2>
				<div id="myUpdataData">
					<form>
						<table>
							<tr>
								<th>账户名</th>
								<td><input type="text" name="aname" id="aname"></td>
							</tr>
							<tr>
								<th>头像</th>
								<td>
									<input type="file" name="myFile" id="myFile">
									<img src="images/1.gif" align="center" style="height: 50px;border-radius: 50%;">
								</td>
							</tr>
							<tr>
								<th>密码:</th>
								<td><input type="password" name="password" id="password"></td>
							</tr>
							<tr>
								<th>性别</th>
                                <td>
                                    <input type="radio" name="sex" id="nan"><label for="nan">♂</label>
                                    <input type="radio" name="sex" id="nv"><label for="nv">♀</label>
                                </td>
							</tr>
                            <tr>
								<th>手机号:</th>
								<td><input type="text"></td>
							</tr>
                            <tr>
								<th>来自:</th>
								<td><input type="text"></td>
							</tr>
							<tr>
								<th colspan="2">
									<input type="submit" value="修改资料">
									<input type="reset">
								</th>
							</tr>
						</table>
					</form>
				</div>
			</div>
		</div>
		<!-- 中 -->
	
		<!-- 下 -->
		<div class="bottomContent">
			<h4>哔哩哔哩无矿产业大学<img src="images/3.gif" align="right" width="110px"></h4>
		</div>
		<!-- 下 -->
	
	
	</div>

</body>
</html>
