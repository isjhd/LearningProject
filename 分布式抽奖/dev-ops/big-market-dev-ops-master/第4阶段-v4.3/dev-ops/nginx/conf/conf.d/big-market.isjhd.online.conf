server {
    listen       80;
    listen  [::]:80;
    server_name  big-market.isjhd.online;

    rewrite ^(.*) https://$server_name$1 permanent;

}

server {
    listen 443 ssl;

    server_name big-market.isjhd.online;  # 修改为你的实际服务器 IP 或域名【域名需要备案】

    ssl_certificate      /etc/nginx/ssl/_.isjhd.online.pem;
    ssl_certificate_key  /etc/nginx/ssl/_.isjhd.online.key;

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    ssl_ciphers  HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;

    location / {
        proxy_pass http://111.228.40.67:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
