version: '3.8'
# 命令执行 docker-compose -f docker-compose-app.yml up -d
services:
  chatgpt-api:
    image: isjhd/chatgpt-api:1.0
    container_name: chatgpt-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TZ=PRC
      - SERVER_PORT=8080
      - APP_CONFIG_API_VERSION=v1
      - APP_CONFIG_CROSS_ORIGIN=*
    volumes:
      - ./log:/data/log
    networks:
      - my-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  my-network:
    driver: bridge