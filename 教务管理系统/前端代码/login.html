<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    
    <div class="background"><!--背景-->

        <div class="box">
            <form class="receive"><!--账号密码的输入-->
                <h1 class="top">Login</h1>
                <div class="manage">———— 教务管理系统 ————</div>
                <table align="center" border="1" cellpadding="0" cellspacing="0" width="300" height="200">
                    <tr>
                        <th>账户名</th>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <th>密码</th>
                        <td><input type="password"></td>
                    </tr>
                    <tr>
                        <th>人员</th>
                        <td>
                            <input type="radio" name="sex" id="administrators"><label for="administrators">管理员</label>
                            <input type="radio" name="sex" id="classTeacher"><label for="classTeacher">班主任</label>
                        </td>
                    </tr>
                    <tr>
                        <th colspan="2"><input type="submit" value="登录"></th>
                    </tr>
                </table>
            </form>
        </div>
    
    </div>
    
</body>
</html>
